<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Module 10 review — key terms</title>
<style>
:root{
  --green:#00693E; --forest:#12312B; --forest-rich:#0D1E1C; --white:#FFFFFF;
  --ink:#12312B; --muted:#4A5F57;
  --soft-green:#E8F2ED; --pale-green:#F4F9F6; --line:#C9DBD2; --line-strong:#6E8F84;
  --danger:#9D162E; --danger-soft:#FBE9EC;
  --success:#00693E; --success-soft:#E8F2ED;
  --shadow:0 8px 28px rgba(18,49,43,.12);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  font-family:"National 2","Aptos","Helvetica Neue",Arial,sans-serif;
  color:var(--ink); background:var(--pale-green);
  line-height:1.55; font-size:16px;
}
.shell{max-width:62rem;margin:0 auto;padding:clamp(.9rem,3vw,1.5rem)}
.eyebrow{
  display:inline-block;background:var(--soft-green);color:var(--green);
  font-size:.72rem;font-weight:800;letter-spacing:.09em;text-transform:uppercase;
  border-radius:999px;padding:.28rem .8rem;margin:0 0 .6rem;
}
h1{font-size:clamp(1.25rem,3.4vw,1.6rem);color:var(--green);margin:0 0 .4rem;line-height:1.25}
.lede{margin:0 0 1.1rem;color:var(--muted);max-width:60ch}
.card{
  background:var(--white);border:2px solid rgba(18,49,43,.10);border-radius:10px;
  padding:clamp(.9rem,2.6vw,1.25rem);box-shadow:var(--shadow);margin-bottom:1rem;
}
.status{
  margin:.9rem 0 0;min-height:1.6rem;font-weight:700;color:var(--forest);
  background:var(--soft-green);border-left:5px solid var(--green);
  border-radius:0 6px 6px 0;padding:.6rem .85rem;
}
.status:empty{display:none}
.status.err{background:var(--danger-soft);border-left-color:var(--danger);color:var(--danger)}
.controls{display:flex;flex-wrap:wrap;gap:.55rem;margin-top:1rem}
.btn{
  flex:1 1 11rem;min-height:3rem;padding:0 1rem;font:inherit;font-weight:800;
  border:2px solid var(--green);border-radius:8px;background:var(--white);color:var(--green);
  cursor:pointer;transition:background 150ms,color 150ms,border-color 150ms;
}
.btn:hover:not(:disabled),.btn:focus-visible:not(:disabled){background:var(--green);color:var(--white)}
.btn:active:not(:disabled){background:var(--forest);border-color:var(--forest);color:var(--white)}
.btn.primary{background:var(--green);color:var(--white)}
.btn.primary:hover:not(:disabled),.btn.primary:focus-visible:not(:disabled){background:var(--forest);border-color:var(--forest)}
.btn:disabled{border-color:var(--line-strong);color:var(--muted);opacity:.55;cursor:not-allowed}
.btn.primary:disabled{background:var(--white);color:var(--muted);border-color:var(--line-strong)}
:focus-visible{outline:3px solid var(--green);outline-offset:2px}
.btn:focus-visible{outline-offset:3px}
/* state signalling always pairs colour with a mark or text (WCAG 1.4.1) */
.mark{font-weight:900;margin-right:.35rem}
.is-correct{border-color:var(--success)!important;background:var(--success-soft)!important}
.is-wrong{border-color:var(--danger)!important;background:var(--danger-soft)!important}
.visually-hidden{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap}
.progress-track{height:10px;background:var(--soft-green);border:1px solid var(--line-strong);border-radius:999px;overflow:hidden;margin:.5rem 0 0}
.progress-fill{height:100%;width:0;background:var(--green);transition:width 240ms ease}
table{border-collapse:collapse;width:100%}
caption{text-align:left;font-weight:800;color:var(--forest);padding-bottom:.5rem}
th,td{text-align:left;padding:.5rem .6rem;border-bottom:1px solid var(--line)}
th{color:var(--green)}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

.deck{perspective:1200px;margin:0 0 .9rem}
.card3d{position:relative;width:100%;min-height:12rem;transition:height 240ms ease}
.face{background:var(--white);border:2px solid var(--green);border-radius:12px;
  padding:1.2rem;display:flex;flex-direction:column;align-items:center;justify-content:center;
  text-align:center;gap:.5rem;min-height:12rem}
.face .tag{font-size:.72rem;letter-spacing:.09em;text-transform:uppercase;font-weight:800;color:var(--green)}
.face .term{font-size:1.35rem;font-weight:900;color:var(--forest);line-height:1.3}
.face .def{font-size:1.02rem;line-height:1.6;max-width:52ch}
.face.back{background:var(--forest);border-color:var(--forest);color:var(--white)}
.face.back .tag{color:#C4DD88}
.face.back .term{color:var(--white);font-size:1.05rem}
.face.back .def{color:var(--white)}
.counter{font-weight:800;color:var(--muted);text-align:center;margin:.2rem 0 0}
.selfcheck{display:flex;gap:.5rem;flex-wrap:wrap;margin-top:.6rem}
.selfcheck .btn{flex:1 1 8rem}
</style>
</head>
<body>
<main class="shell">
<header>
<p class="eyebrow">MUS 10 · Review</p>
<h1>Module 10 key terms</h1>
<p class="lede">Twelve terms from this module. Read the term, try to define it in your head, then reveal the definition and rate yourself honestly &mdash; the rating is what produces your study list at the end.</p>
</header>
<div class="card">
<div class="deck">
  <div class="card3d">
    <div class="face" id="front"><span class="tag">Term</span><span class="term"></span><span class="def" style="color:var(--muted);font-size:.9rem">Define it in your head, then reveal.</span></div>
    <div class="face back" id="back" hidden><span class="tag">Definition</span><span class="term"></span><span class="def"></span></div>
  </div>
</div>
<p class="counter" id="counter"></p>
<div class="progress-track"><div class="progress-fill" id="fill"></div></div>
<div class="controls">
  <button type="button" class="btn" id="prev">&larr; Previous</button>
  <button type="button" class="btn primary" id="flip">Reveal the definition</button>
  <button type="button" class="btn" id="next">Next &rarr;</button>
</div>
<div class="selfcheck" id="sc" hidden>
  <button type="button" class="btn" id="yes">I knew this</button>
  <button type="button" class="btn" id="no">Needs review</button>
</div>
</div>
<div class="card" id="summary" hidden>
<h2 style="font-size:1rem;color:var(--green);margin:0 0 .5rem">Your study list</h2>
<p style="margin:0" id="sumtext"></p>
</div>
<p class="status" id="status" role="status" aria-live="polite"></p>
</main>
<script>
(function(){
  // report height to a parent that cares; harmless when nobody listens
  function ping(){ try{ parent.postMessage({type:'activity-height',h:document.documentElement.scrollHeight},'*'); }catch(e){} }
  window.addEventListener('load',ping); window.addEventListener('resize',ping);
  new MutationObserver(ping).observe(document.body,{subtree:true,childList:true,attributes:true});
})();

var CARDS=[
 {t:'Crossover',d:'A record that charts in more than one market at once — country and pop, or R&amp;B and pop. Reaching an audience beyond the one it was marketed to.'},
 {t:'Countrypolitan / Nashville Sound',d:'Smoother, pop-oriented country from Nashville studios, late 1950s on. Out: fiddle, steel guitar, nasal vocal. In: strings, smooth backing vocals, crooned lead. Chet Atkins and Owen Bradley led it.'},
 {t:'Soul',d:'Gospel&rsquo;s vocal technique, rhythmic feel and emotional intensity applied to secular subject matter. Ray Charles assembled the formula in the mid-1950s.'},
 {t:'Melisma',d:'Singing several pitches on a single syllable. A central gospel technique and one of the clearest signatures of soul singing.'},
 {t:'AABA form',d:'The 32-bar Tin Pan Alley song shape: four eight-bar sections, with the third — the bridge — providing contrast so the final A lands as an arrival.'},
 {t:'Funk',d:'James Brown&rsquo;s style, mid-1960s. Rhythm becomes the primary content: harmony thins to a single chord while every instrument plays an interlocking rhythmic part.'},
 {t:'On the One',d:'Funk&rsquo;s defining shift — emphasis moved off the 2-and-4 backbeat and onto beat 1, hit by the whole band together.'},
 {t:'Urban folk',d:'The mid-century folk revival by city-based, college-educated performers: acoustic instruments, topical lyrics, and an ethic treating commercial production as dishonest.'},
 {t:'Folk-rock',d:'Folk&rsquo;s lyrical seriousness combined with rock&rsquo;s electric instrumentation and production. Dylan at Newport, July 1965, is the flashpoint.'},
 {t:'Counterculture',d:'A convenient label for the rebellious strands of 1960s musical, political and social life — and a simplification, since war opposition, rock fandom and progressive politics did not travel together as neatly as the label implies.'},
 {t:'Power trio',d:'Guitar, bass and drums with the guitarist singing — no rhythm guitar or keyboard to sustain harmony, so all three improvise around each other continuously. Cream is the model.'},
 {t:'Roots rock',d:'The counter-move to psychedelia: short songs built from blues, country and rockabilly rather than studio experiment. Creedence Clearwater Revival set the standard.'}
];
var i=0,flipped=false,known={},statusEl=document.getElementById('status');
var front=document.getElementById('front'),back=document.getElementById('back');
function show(){
  var c=CARDS[i];
  front.querySelector('.term').innerHTML=c.t;
  back.querySelector('.term').innerHTML=c.t;
  back.querySelector('.def').innerHTML=c.d;
  front.hidden=flipped; back.hidden=!flipped;
  document.getElementById('flip').textContent=flipped?'Show the term':'Reveal the definition';
  document.getElementById('counter').textContent='Card '+(i+1)+' of '+CARDS.length;
  document.getElementById('sc').hidden=!flipped;
  var n=Object.keys(known).length;
  document.getElementById('fill').style.width=(n/CARDS.length*100)+'%';
  document.getElementById('prev').disabled=(i===0);
  document.getElementById('next').disabled=(i===CARDS.length-1);
}
function mark(ok){
  known[i]=ok;
  var n=Object.keys(known).length;
  statusEl.className='status';
  statusEl.textContent=(ok?'Marked as known. ':'Marked for review. ')+n+' of '+CARDS.length+' rated.';
  if(n===CARDS.length){
    var hard=Object.keys(known).filter(function(k){return !known[k];}).map(function(k){return CARDS[k].t;});
    document.getElementById('summary').hidden=false;
    document.getElementById('sumtext').innerHTML= hard.length
      ? 'You rated '+(CARDS.length-hard.length)+' of '+CARDS.length+' as known. Worth another pass: <strong>'+hard.join('; ')+'</strong>.'
      : 'You rated all '+CARDS.length+' terms as known. Try the deck once more without revealing the definitions first.';
  }
  if(i<CARDS.length-1){i++;flipped=false;}
  show();
}
document.getElementById('flip').onclick=function(){flipped=!flipped;show();
  statusEl.className='status';statusEl.textContent=flipped?'Definition shown. Rate yourself below.':'Term shown.';};
document.getElementById('prev').onclick=function(){if(i>0){i--;flipped=false;show();}};
document.getElementById('next').onclick=function(){if(i<CARDS.length-1){i++;flipped=false;show();}};
document.getElementById('yes').onclick=function(){mark(true);};
document.getElementById('no').onclick=function(){mark(false);};
show();

</script>
</body>
</html>
